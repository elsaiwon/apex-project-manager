spring:
  application:
    name: apex-backend
  datasource:
    url: jdbc:h2:mem:apexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8087

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.springframework: INFO
    org.hibernate: INFO
    com.apexpm: DEBUG

jwt:
  secret: superSecretKeyMoltoLungaAlmeno32CaratteriCambialaInProd1234567890
  expirationMs: 86400000